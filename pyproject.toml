[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-node-nexus-mcp"
version = "0.1.0"
description = "Typed MCP server for safe Unreal Engine asset, graph, level, and Niagara editor operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13.0",
]

[project.scripts]
ue-node-nexus-mcp = "ue_node_nexus_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
