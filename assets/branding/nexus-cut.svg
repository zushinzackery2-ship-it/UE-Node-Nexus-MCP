<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">UE Node Nexus MCP</title>
  <desc id="desc">A node ring cut on a 45 degree plane, its upper right segment offset along the cut, holding a diamond node at the centre.</desc>
  <defs>
    <path id="ring" d="M36 128A92 92 0 1 0 220 128A92 92 0 1 0 36 128ZM66 128A62 62 0 1 1 190 128A62 62 0 1 1 66 128Z"/>
    <path id="node" d="M128 102L154 128L128 154L102 128Z"/>
    <clipPath id="cutLower"><polygon points="0,256 256,256 256,0"/></clipPath>
    <clipPath id="cutUpper"><polygon points="0,0 256,0 0,256"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="#192226"/>
  <rect x="14.5" y="14.5" width="227" height="227" rx="41.5" stroke="#EEF3F2" stroke-opacity="0.06" stroke-width="1.5"/>
  <g clip-path="url(#cutLower)">
    <use href="#ring" fill="#EEF3F2"/>
    <use href="#node" fill="#57D6C0"/>
  </g>
  <g clip-path="url(#cutUpper)">
    <g transform="translate(-7,-7)">
      <use href="#ring" fill="#EEF3F2"/>
      <use href="#node" fill="#57D6C0"/>
    </g>
  </g>
</svg>
